<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>情緒偵探社</title>
<style>
/* 版面：上方是 480×272 像素畫面，下方固定 100px 操作列；對話、面板疊在畫面上 */
:root{
  color-scheme:dark;
  --ink:#2B2D42; --mist:#8D99AE; --paper:#EDF2F4; --red:#EF233C; --orange:#F4A261;
  --yellow:#E9C46A; --green:#2A9D8F; --violet:#7B6D8D; --pink:#F2B5D4; --sky:#8ecae6;
  --deep:#1b1c2b; --panel:#2B2D42; --panel2:#3a3c56;
  --f:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--deep);color:var(--paper);font-family:var(--f);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font-family:var(--f);color:var(--paper);cursor:pointer}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
/* ===== 響應式版面：依螢幕比例切換三種排法（JS 在 body 加 L-normal / L-wide / L-tall） =====
   normal：平板、電腦橫放。上方資訊列、中間畫面、下方操作列，對話疊在畫面下緣
   wide  ：手機橫放。左右兩欄放按鈕，畫面在中間，不疊在畫面上
   tall  ：手機、平板直放。畫面在上，對話與按鈕在下，彼此不重疊 */
#app{position:fixed;inset:0;display:grid;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#top{grid-area:top;display:flex;align-items:center;gap:10px;padding:6px 10px;min-width:0;background:#141522;border-bottom:3px solid var(--ink)}
#screen{grid-area:screen;position:relative;display:grid;place-items:center;min-height:0;min-width:0;overflow:hidden}
#cv{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:var(--ink)}
#talk{grid-area:screen;align-self:end;z-index:5;padding:0 10px 10px;min-width:0;pointer-events:none}
#talk > *{pointer-events:auto}
#controls{grid-area:ctl;background:#141522;border-top:3px solid var(--ink);padding:0 14px;min-width:0}
.strip{height:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
.ctl{display:flex;gap:12px}
#lookBtn{flex-direction:column;gap:0;min-width:150px;border-color:var(--yellow);background:#6b5520;font-size:20px;line-height:1.2}
#lookBtn small{font-size:13px;font-weight:400;color:var(--paper);max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lookBtn[disabled]{border-color:var(--mist);background:var(--panel);opacity:.55}

body.L-normal #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 100px;grid-template-areas:"top" "screen" "ctl"}

body.L-wide #app{grid-template-columns:168px minmax(0,1fr) 196px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"left top right" "left screen right";background:#141522}
body.L-wide #controls,body.L-wide .strip{display:contents}
body.L-wide #ctlMove,body.L-wide #notesBtn{grid-area:left;align-self:end;justify-self:center;margin-bottom:14px}
body.L-wide #notesBtn{align-self:center}
body.L-wide #skills{grid-area:right;align-self:start;justify-self:center;display:grid;grid-template-columns:repeat(2,auto);margin-top:12px}
body.L-wide #ctlJump,body.L-wide #bookBtn{grid-area:right;align-self:end;justify-self:center;margin-bottom:14px}
body.L-wide #bookBtn{align-self:center}
body.L-wide #lookBtn{grid-area:right;align-self:end;justify-self:center;margin-bottom:14px;min-width:150px}
body.L-wide #dtext{font-size:17px;min-height:0}
body.L-wide .dbox{padding:8px 12px 6px}

body.L-tall #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"top" "screen" "talk" "ctl"}
body.L-tall #screen{aspect-ratio:480/272;max-height:46vh;width:100%}
body.L-tall #talk{grid-area:talk;align-self:start;padding:10px}
body.L-tall #controls{padding:10px 12px}
body.L-tall #ctlStage{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"sk sk sk" "mv . jp";gap:12px}
body.L-tall #ctlStage[hidden]{display:none}
body.L-tall #skills{grid-area:sk;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
body.L-tall .sk{width:auto}
body.L-tall #ctlMove{grid-area:mv}
body.L-tall #ctlJump{grid-area:jp}
body.L-tall #ctlTown{min-height:76px;gap:8px}
body.L-tall .tb{min-width:0;flex:1 1 0;padding:0 4px;font-size:15px;white-space:nowrap;gap:3px}
body.L-tall #lookBtn{flex:1.4 1 0;min-width:0;font-size:18px}

/* 上方資訊列 */
#hud{flex:none}
#bar{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}
#bar .track{width:clamp(90px,22vw,180px);height:16px;background:#2a2b40;border:2px solid var(--mist);position:relative}
#bar .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--yellow),var(--orange),var(--red));transition:width .25s}
#obj{flex:1;min-width:0;font-size:18px;font-weight:700;color:var(--yellow);line-height:1.35}
#obj small{display:block;font-size:14px;font-weight:400;color:var(--mist)}
#pauseBtn{flex:none;margin-left:auto;width:48px;height:48px;font-size:20px;font-weight:700;background:var(--panel);border:3px solid var(--mist);border-radius:8px}
body.L-wide #obj{font-size:15px}body.L-wide #obj small{display:none}

/* 操作按鈕 */
.btn{touch-action:none;width:72px;height:72px;border-radius:12px;border:3px solid var(--mist);background:rgba(43,45,66,.82);font:700 28px var(--f);display:grid;place-items:center}
.btn.on{background:rgba(233,196,106,.55);border-color:var(--yellow)}
#jump{width:84px;height:84px;border-radius:50%;font-size:22px;border-color:var(--yellow)}
#skills{display:flex;gap:10px}
.sk{touch-action:none;position:relative;width:88px;height:62px;border-radius:10px;border:3px solid var(--mist);background:rgba(43,45,66,.86);font:700 16px var(--f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden}
.sk i{font-style:normal;font-size:20px;line-height:1}
.sk .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);height:0}
.sk.locked{opacity:.3}
.sk[data-k=breath]{border-color:var(--sky)}.sk[data-k=pause]{border-color:var(--yellow)}
.sk[data-k=angle]{border-color:var(--violet)}.sk[data-k=say]{border-color:var(--pink)}
.tb{min-width:112px;height:64px;border-radius:10px;border:3px solid var(--mist);background:var(--panel);font:700 18px var(--f);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px}
.tb b{color:var(--yellow);font-variant-numeric:tabular-nums}

/* 提示 */
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:min(92vw,560px);background:rgba(43,45,66,.95);
  border:3px solid var(--yellow);border-radius:8px;padding:10px 16px;font-size:19px;line-height:1.5;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6}
#toast.on{opacity:1}

/* 對話框 */
#dlg{display:flex;justify-content:center}
.dbox{width:min(760px,100%);background:#1f2133;border:4px solid var(--mist);border-radius:10px;box-shadow:0 5px 0 #0d0e18;padding:14px 18px 10px;cursor:pointer}
#dname{font-size:17px;font-weight:700;color:var(--yellow);min-height:1.2em}
#dname.inner{color:var(--sky)}
#dtext{font-size:21px;line-height:1.65;margin-top:4px;min-height:3.3em}
#dtext.sys{color:#c9cfdc;font-size:19px}
.dnext{text-align:right;font-size:13px;color:var(--mist);margin-top:2px}

/* 面板 */
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,21,34,.8);padding:16px;z-index:8}
.ov.on{display:flex}
.card{width:min(680px,100%);max-height:100%;overflow-y:auto;background:var(--panel);border:4px solid var(--mist);border-radius:10px;padding:20px 24px;box-shadow:0 6px 0 #0d0e18;overscroll-behavior:contain;touch-action:pan-y}
.card h2{margin:0 0 10px;font-size:26px;color:var(--yellow);text-wrap:balance}
.card p{font-size:19px;line-height:1.7;margin:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pb{min-height:58px;padding:8px 18px;font:700 19px var(--f);border-radius:10px;border:3px solid var(--mist);background:var(--panel2);text-align:left;line-height:1.4}
.pb.pri{border-color:var(--yellow);background:#6b5520}
.pb.wide{width:100%}
.pb[disabled]{opacity:.35}
.pb.got{border-color:var(--green)}
.who{color:var(--pink);font-weight:700}
.tag{display:inline-block;font-size:14px;padding:1px 8px;border-radius:4px;background:var(--panel2);color:var(--mist);margin-right:6px;vertical-align:2px}
.tag.face{background:#6b5520;color:#fff}.tag.body{background:#2c5168;color:#fff}.tag.talk{background:#7a3a52;color:#fff}.tag.scene{background:#3e5a42;color:#fff}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.words .pb{text-align:center;padding:8px}
.pb.sel{border-color:var(--yellow);background:#6b5520}
.lv{display:flex;gap:8px;margin-top:8px}
.lv .pb{width:58px;text-align:center;padding:0}
.hint{font-size:16px;color:var(--mist);margin:6px 0 0}
.fit{display:inline-block;font-weight:700;padding:2px 10px;border-radius:6px;font-size:16px}
.fit.great{background:var(--green)}.fit.ok{background:#8a6d2a}.fit.bad{background:#8a3a3a}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.ecard{background:var(--panel2);border:3px solid var(--mist);border-radius:8px;padding:10px 12px;font-size:15px;line-height:1.6;min-width:0}
.ecard h3{margin:0 0 4px;font-size:21px;color:var(--yellow)}
.ecard.none{display:grid;place-items:center;min-height:120px;color:var(--mist);font-size:40px;border-style:dashed}
.ecard dt{color:var(--mist);font-size:13px}.ecard dd{margin:0 0 4px}
.cite{font-size:13px;color:var(--mist);line-height:1.6;margin-top:14px}

/* 章節選擇 */
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;margin-top:10px}
.chc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 10px;border-radius:10px;border:3px solid var(--yellow);background:var(--panel2);min-width:0;text-align:center}
.chc .che{font-size:38px;line-height:1.1}
.chc b{font-size:15px;color:var(--mist)}
.chc .chn{font-size:24px;font-weight:900;color:var(--yellow)}
.chc small{font-size:13px;color:var(--paper);line-height:1.4}
.chc i{font-style:normal;font-size:13px;margin-top:4px;padding:1px 10px;border-radius:999px;background:var(--green)}
.chc.soon{border-color:var(--mist);opacity:.55}
.chc.soon i{background:#5a5d7a}
/* 開始畫面 */
#titleScr{background:var(--ink) center/cover no-repeat;align-items:flex-start;padding-top:6vh;z-index:9}
.tcard{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.eyebrow{margin:0;font-size:16px;letter-spacing:.2em;background:rgba(43,45,66,.7);padding:4px 12px;border-radius:4px}
.gname{margin:0;font-size:clamp(44px,9vw,84px);font-weight:900;color:var(--yellow);letter-spacing:.08em;
  text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
.gsub{margin:0;font-size:22px;font-weight:700;text-shadow:2px 2px 0 var(--ink)}
#startBtn{margin-top:14px;min-height:60px;padding:0 40px;font:700 24px var(--f);border-radius:12px;border:4px solid var(--ink);background:var(--yellow);color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.keys{margin:8px 0 0;font-size:15px;background:rgba(43,45,66,.75);padding:4px 12px;border-radius:6px;text-align:center}
.credit{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:var(--paper);text-shadow:1px 1px 0 var(--ink)}

#err{position:fixed;left:8px;bottom:4px;font-size:12px;color:var(--red);z-index:30}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="L-normal">
<div id="app">
  <header id="top">
    <div id="hud" hidden><div id="bar"><span>我的情緒</span><span class="track"><span class="fill" id="barFill"></span></span></div></div>
    <div id="obj"></div>
    <button id="pauseBtn" aria-label="暫停">||</button>
  </header>
  <main id="screen"><canvas id="cv" width="480" height="272" aria-label="遊戲畫面"></canvas><div id="toast"></div></main>
  <section id="talk"><div id="dlg" hidden><div class="dbox" id="dbox"><div id="dname"></div><div id="dtext"></div><div class="dnext">點一下繼續 ▼</div></div></div></section>
  <nav id="controls">
    <div class="strip" id="ctlTown">
      <button class="tb" id="notesBtn">📝 線索 <b id="clueN">0/4</b></button>
      <button class="tb" id="lookBtn" disabled>🔎 調查<small id="lookName">走到人或東西旁邊</small></button>
      <button class="tb" id="bookBtn">📖 圖鑑</button>
    </div>
    <div class="strip" id="ctlStage" hidden>
      <div class="ctl" id="ctlMove">
        <button class="btn" id="left" aria-label="往左">◀</button>
        <button class="btn" id="right" aria-label="往右">▶</button>
      </div>
      <div id="skills">
        <button class="sk" data-k="breath"><i>🫁</i>深呼吸<span class="cd"></span></button>
        <button class="sk" data-k="pause"><i>✋</i>暫停<span class="cd"></span></button>
        <button class="sk" data-k="angle"><i>🔄</i>換個角度<span class="cd"></span></button>
        <button class="sk" data-k="say"><i>💬</i>說出來<span class="cd"></span></button>
      </div>
      <div class="ctl" id="ctlJump"><button class="btn" id="jump" aria-label="跳">跳</button></div>
    </div>
  </nav>
</div>

<div class="ov" id="panel"><div class="card"><h2 id="pTitle"></h2><div id="pBody"></div><div class="row" id="pBtns"></div></div></div>

<div class="ov on" id="titleScr">
  <div class="tcard">
    <p class="eyebrow">莒光資優班・認識情緒</p>
    <h1 class="gname">情緒偵探社</h1>
    <p class="gsub">第三章：生氣</p>
    <button id="startBtn">開始</button>
    <p class="keys">平板、手機直接點；電腦也可以用方向鍵、空白鍵，數字鍵 1～4 是技能</p>
  </div>
  <p class="credit">角色與情境均為虛構，遊戲不記錄任何學生資料</p>
</div>

<div class="ov" id="paused"><div class="card">
  <h2>暫停中</h2>
  <div class="row"><button class="pb pri" id="resumeBtn">繼續</button><button class="pb" id="restartBtn">回到開始畫面</button></div>
</div></div>

<div class="ov" id="chapters"><div class="card">
  <h2>選擇章節</h2>
  <p class="hint">每一章大約 20 分鐘，可以只玩其中一章。</p>
  <div class="chs" id="chList"></div>
  <div class="row"><button class="pb" id="chBack">回到開始畫面</button></div>
</div></div>

<div class="ov" id="settle"><div class="card" id="settleCard"></div></div>

<div id="err"></div>

<script>
(() => {
'use strict';

/* =========================================================
   闖關引擎：關卡、怪物、提示句（換關卡只改 LEVEL、HINT、WRONG）
   ========================================================= */
const TS = 16, VW = 480, VH = 272, ROWS = 17, GROUND = 14;
const LEVEL = {
  w: 120,

  hidden: [[51,12,2],[54,11,2],[57,12,2]],          // 暗區裡要「說出來」才看得見的平台
  dark: [46,62],                                    // 暗區範圍（欄）
  angry: [[12,9,16],[35,32,39],[86,84,91],[109,106,112]], // [出生欄, 巡邏左, 巡邏右]
  frustrated: [{x:65, bridge:[66,71]}, {x:97, bridge:[98,103]}],
  checkpoints: [2,44,81],
  door: 116,
};
const HINT = {

  frustrated: '跳不過去，就換個角度。',
  dark: '看不見路的時候，把感覺說出來。',
  pit: '掉下去了沒關係，從旗子那裡再來一次。',
};
const WRONG = {
  angry_angle: '生氣怪還在冒煙……它需要的不是換個角度，是先停下來。',
  angry_say: '說出來了，可是生氣怪還在膨脹。先讓身體停一下試試？',
  frustrated_breath: '挫折怪還是打著結。卡住的時候，也許要換個角度。',
  frustrated_pause: '停下來了，可是路還是被擋住。換個角度看看？',
  dark_breath: '呼吸平穩了，可是還是看不見路。把感覺說出來？',
  dark_pause: '停下來了，四周還是黑的。把感覺說出來？',

const SKILL = { breath:{cd:4}, pause:{cd:3}, angle:{cd:2}, say:{cd:3} };
const SAY_LINES = ['我很生氣！','我覺得很丟臉！','我被撞到很不舒服！'];
const COL = { ink:'#2B2D42', mist:'#8D99AE', paper:'#EDF2F4', red:'#EF233C', orange:'#F4A261', yellow:'#E9C46A',
  green:'#2A9D8F', violet:'#7B6D8D', pink:'#F2B5D4', grass:'#5fae5a', dirt:'#8a5a3c', dirt2:'#6e452d', skin:'#F2C9A0', cap:'#7a4a2a', pants:'#3d4a6b' };

/* =========================================================
   ② 規則：物理、怪物、技能、情緒條
   ========================================================= */
const G = 900, RUN = 92, JUMP = 300, COYOTE = .1, BUFFER = .12;
let grid, S;
const input = { left:false, right:false, jump:false, jumpPressed:false };

function buildGrid(){
  grid = Array.from({length:ROWS}, () => new Uint8Array(LEVEL.w));
  for (let x = 0; x < LEVEL.w; x++) for (let y = GROUND; y < ROWS; y++) grid[y][x] = 1;
  LEVEL.pits.forEach(([a,b]) => { for (let x = a; x <= b; x++) for (let y = GROUND; y < ROWS; y++) grid[y][x] = 0; });
  LEVEL.platforms.forEach(([x,y,n]) => { for (let i = 0; i < n; i++) grid[y][x+i] = 1; });
  LEVEL.hidden.forEach(([x,y,n]) => { for (let i = 0; i < n; i++) grid[y][x+i] = 3; }); // 3 = 暗區平台，點亮後才算實心
  for (let y = 0; y < ROWS; y++) grid[y][0] = 1;
}
function solid(tx, ty){
  if (tx < 0 || tx >= LEVEL.w) return true;
  if (ty < 0) return false;
  if (ty >= ROWS) return false;
  const v = grid[ty][tx];
  return v === 1 || v === 2 || (v === 3 && S.lit);
}
function newState(){
  return {
    t:0, running:false, won:false, paused:false,
    p:{x:LEVEL.start*TS, y:(GROUND-1)*TS, vx:0, vy:0, w:10, h:16, face:1, ground:false, coyote:0, buf:0, anim:0, inv:0, pauseT:0},
    bar:20, cp:LEVEL.checkpoints[0], cpReached:{[LEVEL.checkpoints[0]]:true},
    cd:{breath:0,pause:0,angle:0,say:0}, slowT:0, lit:false, litR:0, shake:0, cam:0,
    fx:[], say:null, lastCause:null, calmAt:0, respawnAt:0,
    angry: LEVEL.angry.map(([x,a,b]) => ({x:x*TS, y:(GROUND)*TS, a:a*TS, b:b*TS, dir:1, state:'normal', h:MON_H.normal})),
    fr: LEVEL.frustrated.map(f => ({x:f.x*TS, bridge:f.bridge, state:'knot', k:0})),
    stats:{hits:0, falls:0, resets:0, used:{breath:0,pause:0,angle:0,say:0}, wrong:0},
  };
}
function reset(){
  buildGrid(); S = newState();
  S.fr.forEach(f => setWall(f, true));
  updateBar(); refreshSkills();
}
function setWall(f, on){ const tx = Math.round(f.x/TS); for (let y = GROUND-5; y < GROUND; y++) for (let x = tx-2; x <= tx; x++) grid[y][x] = on ? 2 : 0; }
const wallMid = f => f.x - 8;

function hurt(amount, cause, dir){
  const p = S.p; if (p.inv > 0 || p.pauseT > 0) return;
  S.bar = Math.min(100, S.bar + amount); S.lastCause = cause; S.stats.hits++;
  p.vx = -dir * 170; p.vy = -200; p.inv = 1.1; p.pauseT = 0;
  S.shake = .2; updateBar();
  if (S.bar >= 100) overload();
}
function overload(){
  S.shake = .6; S.stats.resets++;
  S.respawnAt = S.t + .45;
}
function respawn(){
  const p = S.p; p.x = S.cp*TS + 2; p.y = (GROUND-1)*TS; p.vx = p.vy = 0; p.inv = 1; p.pauseT = 0;
  S.bar = 30; updateBar();
}
function calmNear(r){
  let n = 0;
  S.angry.forEach(m => { if (m.state !== 'calm' && Math.abs(m.x - S.p.x) < r){ m.state = 'calm'; n++; burst(m.x, m.y-10, COL.pink, 10); } });
  return n;
}
function nearTarget(){
  const px = S.p.x;
  const a = S.angry.find(m => m.state !== 'calm' && Math.abs(m.x - px) < 130);
  const f = S.fr.find(m => m.state === 'knot' && Math.abs(m.x - px) < 100);
  const inDark = !S.lit && px/TS > LEVEL.dark[0]-3 && px/TS < LEVEL.dark[1];
  return a ? 'angry' : f ? 'frustrated' : inDark ? 'dark' : null;
}
function useSkill(k){
  if (!S.running || S.paused || S.won || S.cd[k] > 0) return false;
  if (!Game.skills.has(k)){ toast('這招還沒學會。', 1400); return false; }
  const target = nearTarget(); S.cd[k] = SKILL[k].cd; S.stats.used[k]++;
  const p = S.p;
  if (k === 'breath'){
    S.slowT = 3; S.bar = Math.max(0, S.bar - 15); updateBar();
    ring(p.x+5, p.y+8, '#8ecae6');
    if (target === 'angry') S.calmAt = S.t + .9;
    else if (target) wrong(target + '_breath');
  } else if (k === 'pause'){
    p.pauseT = 2; p.vx = 0; ring(p.x+5, p.y+8, COL.yellow);
    if (target && target !== 'angry') wrong(target + '_pause');
  } else if (k === 'angle'){
    const f = S.fr.find(m => m.state === 'knot' && Math.abs(m.x - p.x) < 100);
    if (f){ f.state = 'untie'; f.k = 0; setWall(f, false); burst(wallMid(f), (GROUND-3)*TS, COL.violet, 16); }
    else if (target) wrong(target + '_angle');
    spin(p.x+5, p.y+8);
  } else if (k === 'say'){
    S.say = {txt:SAY_LINES[S.stats.used.say % SAY_LINES.length], t:1.6};
    S.bar = Math.max(0, S.bar - 10); updateBar();
    if (target === 'dark'){ S.lit = true; burst(p.x, p.y, COL.yellow, 24); }
    else if (target) wrong(target + '_say');
  }
  if (!target) toast(WRONG.none, 1600);
  refreshSkills();
  return true;
}
function wrong(key){ if (WRONG[key]){ toast(WRONG[key], 2600); S.stats.wrong++; } }

function moveBody(b, dt){
  // X
  b.x += b.vx * dt;
  let x0 = Math.floor(b.x/TS), x1 = Math.floor((b.x+b.w-1)/TS), y0 = Math.floor(b.y/TS), y1 = Math.floor((b.y+b.h-1)/TS);
  for (let ty = y0; ty <= y1; ty++){
    if (b.vx > 0 && solid(x1, ty)){ b.x = x1*TS - b.w; b.vx = 0; break; }
    if (b.vx < 0 && solid(x0, ty)){ b.x = (x0+1)*TS; b.vx = 0; break; }
  }
  // Y
  b.y += b.vy * dt; b.ground = false;
  x0 = Math.floor(b.x/TS); x1 = Math.floor((b.x+b.w-1)/TS); y0 = Math.floor(b.y/TS); y1 = Math.floor((b.y+b.h-.01)/TS); // 用腳底實際位置判斷，避免站著時每幾格就離地一次
  for (let tx = x0; tx <= x1; tx++){
    if (b.vy > 0 && solid(tx, y1)){ b.y = y1*TS - b.h; b.vy = 0; b.ground = true; break; }
    if (b.vy < 0 && solid(tx, y0)){ b.y = (y0+1)*TS; b.vy = 0; break; }
  }
}

function update(dt){
  if (!S.running || S.paused || S.won) return;
  S.t += dt;
  const p = S.p, wdt = S.slowT > 0 ? dt*.35 : dt;
  for (const k in S.cd) S.cd[k] = Math.max(0, S.cd[k] - dt);
  S.slowT = Math.max(0, S.slowT - dt); p.inv = Math.max(0, p.inv - dt); S.shake = Math.max(0, S.shake - dt);

  if (S.respawnAt && S.t >= S.respawnAt){ S.respawnAt = 0; respawn(); toast(HINT[S.lastCause] || HINT.pit, 3200); }
  if (S.calmAt && S.t >= S.calmAt){ S.calmAt = 0; if (calmNear(130)) toast('生氣怪慢慢縮小了。', 1400); }
  // 暫停技能：原地站 2 秒
  if (p.pauseT > 0){
    p.pauseT -= dt; p.vx = 0; S.bar = Math.max(0, S.bar - 6*dt);
    if (p.pauseT <= 0){ p.pauseT = 0; const n = calmNear(130); if (n) toast('生氣怪慢慢縮小了。', 1400); updateBar(); }
  } else {
    const dir = (input.right?1:0) - (input.left?1:0);
    if (p.inv < .8) p.vx = dir * RUN;
    if (dir) p.face = dir;
  }
  // 跳躍（含土狼時間與預按）
  if (input.jumpPressed){ p.buf = BUFFER; input.jumpPressed = false; }
  p.buf = Math.max(0, p.buf - dt);
  p.coyote = p.ground ? COYOTE : Math.max(0, p.coyote - dt);
  if (p.buf > 0 && p.coyote > 0 && p.pauseT <= 0){ p.vy = -JUMP; p.buf = 0; p.coyote = 0; }
  if (!input.jump && p.vy < -120) p.vy = -120; // 放開早一點，跳得低一點
  p.vy = Math.min(p.vy + G*dt, 520);
  moveBody(p, dt);
  p.anim += Math.abs(p.vx) * dt;

  // 掉坑
  if (p.y > VH + 20){ S.stats.falls++; S.lastCause = (p.x/TS > LEVEL.dark[0] && p.x/TS < LEVEL.dark[1] && !S.lit) ? 'dark' : 'pit';
    S.bar = Math.min(95, S.bar + 10); respawn(); toast(HINT[S.lastCause], 2600); }

  // 檢查點
  LEVEL.checkpoints.forEach(c => { if (!S.cpReached[c] && p.x > c*TS){ S.cpReached[c] = true; S.cp = c; burst(c*TS+4, (GROUND-2)*TS, COL.yellow, 12); } });

  // 生氣怪
  S.angry.forEach(m => {
    if (m.state === 'calm'){ m.h += (MON_H.calm - m.h) * Math.min(1, dt*6); return; }
    const near = Math.abs(m.x - p.x) < 60 && Math.abs(m.y - (p.y+p.h)) < 70;
    m.state = near ? 'puff' : 'normal';
    m.h += ((near ? MON_H.puff : MON_H.normal) - m.h) * Math.min(1, wdt*8);
    const watching = p.pauseT > 0 && Math.abs(m.x - p.x) < 130;
    if (!watching) m.x += m.dir * 22 * wdt; if (m.x < m.a){ m.x = m.a; m.dir = 1; } if (m.x > m.b){ m.x = m.b; m.dir = -1; }
    const hw = m.h*.42, hh = m.h*.9;
    if (p.x < m.x+hw && p.x+p.w > m.x-hw && p.y < m.y && p.y+p.h > m.y-hh){
      if (p.inv > 0 || p.pauseT > 0){ p.x = p.x + p.w/2 < m.x ? m.x - hw - p.w : m.x + hw; p.vx = 0; } // 沒冷靜下來前過不去
      else hurt(m.state === 'puff' ? 30 : 15, 'angry', p.x < m.x ? 1 : -1);
    }
    if (m.state === 'puff' && Math.random() < wdt*6) S.fx.push({k:'steam', x:m.x+(Math.random()*10-5), y:m.y-hh-2, vy:-20, t:.8});
  });
  // 挫折怪：撞到牆會被彈開
  S.fr.forEach(f => {
    if (f.state === 'untie'){ f.k = Math.min(1, f.k + dt*1.4); if (f.k >= 1){ f.state = 'bridge'; for (let x = f.bridge[0]; x <= f.bridge[1]; x++) grid[GROUND][x] = 1; } return; }
    if (f.state !== 'knot') return;
    if (Math.abs((p.x+p.w/2) - wallMid(f)) < 32 && p.y+p.h > (GROUND-5)*TS) hurt(10, 'frustrated', p.x < f.x ? 1 : -1);
  });

  // 終點
  if (p.x >= LEVEL.door*TS){ win(); }

  // 特效
  S.fx.forEach(e => { e.t -= dt; if (e.vy) e.y += e.vy*dt; if (e.vx) e.x += e.vx*dt; if (e.r != null) e.r += e.dr*dt; });
  S.fx = S.fx.filter(e => e.t > 0);
  if (S.say){ S.say.t -= dt; if (S.say.t <= 0) S.say = null; }
  if (S.lit) S.litR = Math.min(1, S.litR + dt*1.5);

  // 鏡頭
  const target = p.x - VW*.4; S.cam += (target - S.cam) * Math.min(1, dt*6);
  S.cam = Math.max(0, Math.min(LEVEL.w*TS - VW, S.cam));
}
function burst(x, y, c, n){ for (let i = 0; i < n; i++){ const a = Math.random()*Math.PI*2, v = 30+Math.random()*60; S.fx.push({k:'dot', x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, c, t:.6+Math.random()*.3}); } }
function ring(x, y, c){ S.fx.push({k:'ring', x, y, r:6, dr:70, c, t:.9}); }
function spin(x, y){ S.fx.push({k:'spin', x, y, t:.6}); }
function win(){ S.won = true; setTimeout(() => Game.stageWon(S.stats), 700); }

function drawBg(cam){

function drawTiles(cam){

  for (let ty = 0; ty < ROWS; ty++) for (let tx = x0; tx <= x1; tx++){

    if (v !== 1 && ty >= GROUND){ R(sx, sy, TS, TS, ty === GROUND ? '#2a2b40' : '#1b1c2b'); continue; }
    if (v === 1){

      R(sx, sy, TS, TS, (tx+ty)%2 ? COL.dirt : COL.dirt2);
      R(sx+3, sy+7, 2, 2, '#a0704c'); R(sx+10, sy+11, 2, 2, '#5a3826');
      if (top){ R(sx, sy, TS, 5, COL.grass); R(sx, sy+5, TS, 1, '#3f7a3c'); R(sx+2, sy-1, 2, 1, COL.grass); R(sx+9, sy-1, 2, 1, COL.grass); }

    } else if (v === 3 && S.lit){

  }
  // 挫折怪變成的橋
  S.fr.forEach(f => { if (f.state === 'knot') return;
    const a = f.bridge[0]*TS - cam, len = (f.bridge[1]-f.bridge[0]+1)*TS * (f.state === 'bridge' ? 1 : f.k);
    for (let i = 0; i < len; i += 4){ const wy = GROUND*TS + Math.round(Math.sin((i+S.t*30)/10)); R(a + i, wy, 4, 5, i%8 ? COL.pink : COL.violet); }
  });
}
function drawFlag(x, on){ R(x, (GROUND-3)*TS, 2, 48, COL.ink); O(x+2, (GROUND-3)*TS, 12, 8, on ? COL.yellow : COL.mist); }
function drawDoor(x){
  const y = (GROUND-4)*TS;
  O(x, y, 40, 64, '#b07a4a'); R(x+4, y+4, 32, 56, '#8a5a34'); R(x+30, y+34, 3, 3, COL.yellow);
  O(x+6, y-18, 28, 14, COL.paper);                     // 招牌
  R(x+12, y-15, 7, 7, COL.ink); R(x+13, y-14, 5, 5, '#8ecae6'); R(x+19, y-9, 5, 2, COL.ink); // 放大鏡
}
function drawPlayer(cam){
  const p = S.p; if (p.inv > 0 && Math.floor(p.inv*12)%2) return;
  const cx = Math.round(p.x + p.w/2 - cam), top = Math.round(p.y), f = p.face;
  const X = (dx, w) => f > 0 ? cx + dx : cx - dx - w;   // 依面向翻轉
  const P = (dx, y, w, h, c) => O(X(dx, w), top + y, w, h, c);
  const air = !p.ground, paused = p.pauseT > 0;
  const step = Math.floor(p.anim / 7) % 4;              // 走路四格：站、前跨、站、後跨
  // 腿
  if (air){ P(-4, 12, 3, 3, COL.pants); P(1, 11, 3, 3, COL.pants); }
  else if (step === 1){ P(-5, 12, 3, 4, COL.pants); P(2, 12, 3, 4, COL.pants); }
  else if (step === 3){ P(-3, 12, 3, 4, COL.pants); P(0, 13, 3, 3, COL.pants); }
  else { P(-4, 12, 3, 4, COL.pants); P(1, 12, 3, 4, COL.pants); }
  // 身體與手
  P(-4, 8, 8, 5, COL.green);
  if (paused){ P(-6, 8, 2, 5, COL.green); P(4, 8, 2, 5, COL.green); }
  else { const sw = (!air && (step === 1 || step === 3)) ? (step === 1 ? -1 : 1) : 0; P(-6, 8 + Math.max(0,sw), 2, 4, COL.green); P(4, 8 + Math.max(0,-sw), 2, 4, COL.green); }
  // 頭
  P(-4, 2, 8, 6, COL.skin); R(X(-4, 2), top+2, 2, 3, '#3b2a20');
  if (paused) R(X(1, 2), top+5, 2, 1, COL.ink); else R(X(1, 1), top+4, 1, 2, COL.ink);
  // 偵探帽
  P(-5, -1, 9, 3, COL.cap); R(X(3, 4), top+2, 4, 1, COL.cap);
  // 暫停倒數圈
  if (paused){ g.strokeStyle = COL.yellow; g.lineWidth = 2; g.beginPath(); g.arc(cx, top+7, 13, -Math.PI/2, -Math.PI/2 + Math.PI*2*(1 - p.pauseT/2)); g.stroke(); }
}
function drawAngry(m, cam){
  const im = IMGS[m.state === 'calm' ? 'calm' : m.state === 'puff' ? 'puff' : 'normal'];
  if (im){ const h = Math.round(m.h), w = Math.round(im.width * h / im.height); g.drawImage(im, Math.round(m.x - w/2 - cam), Math.round(m.y - h), w, h); return; }
  const s = m.h / MON_H.normal;
  const w = Math.round(14*s), h = Math.round(12*s), x = Math.round(m.x - w/2 - cam), y = Math.round(m.y - h);
  const calm = m.state === 'calm', body = calm ? COL.pink : (m.state === 'puff' ? '#ff4b3e' : COL.red);
  if (!calm){ // 頭頂火苗
    const fl = Math.max(2, Math.round(3*s));
    [[.15,1],[.45,1.6],[.75,1]].forEach(([fx, fh]) => O(x + w*fx, y - fl*fh, Math.max(2, Math.round(2*s)), fl*fh, COL.orange));
  }
  O(x, y, w, h, body); R(x+1, y+1, w-2, 2, calm ? '#fbd5e6' : '#ff7b6e');
  const ex = Math.round(w*.25), ey = y + Math.round(h*.35), es = Math.max(1, Math.round(s));
  if (calm){ R(x+ex, ey+1, 3*es, 1, COL.ink); R(x+w-ex-3*es, ey+1, 3*es, 1, COL.ink); R(x+w/2-2, y+h-4, 4, 1, COL.ink); }
  else {
    R(x+ex, ey, 2*es, 2*es, COL.ink); R(x+w-ex-2*es, ey, 2*es, 2*es, COL.ink);
    R(x+ex-1, ey-2*es, es, es, COL.ink); R(x+ex, ey-es, 2*es, es, COL.ink);            // 左眉往內下斜
    R(x+w-ex-2*es, ey-es, 2*es, es, COL.ink); R(x+w-ex, ey-2*es, es, es, COL.ink);    // 右眉
    R(x+w/2-3*es, y+h-4*es, 6*es, es, COL.ink);
  }
}
function disc(cx, cy, r, c){ for (let dy = -r; dy <= r; dy++){ const w = Math.floor(Math.sqrt(r*r - dy*dy)); R(cx - w, cy + dy, w*2 + 1, 1, c); } }
function drawFrustrated(f, cam){

    if (i === 2){ R(cx - 4, cy - 2, 2, 1, COL.ink); R(cx + 2, cy - 2, 2, 1, COL.ink); R(cx - 3, cy + 3, 2, 1, COL.ink); R(cx - 1, cy + 4, 3, 1, COL.ink); }
  }
  // 從牆上垂下的線頭
  R(x + 14, baseY - 40, 1, 10, '#a99bba'); R(x + 15, baseY - 31, 2, 1, '#a99bba');
  g.globalAlpha = 1;
}
function drawDark(cam){
  if (S.litR >= 1) return;

const Town = (() => {
  const W = MAP.w, H = MAP.h, SPEED = 74;
  const FLOOR = {wood:1, class:2, hall:3, grass:4, court:5};
  let tiles, block, T;

  function build(){
    tiles = Array.from({length:H}, () => new Uint8Array(W));
    MAP.rooms.forEach(([x,y,w,h,f]) => { for (let j = y; j < y+h; j++) for (let i = x; i < x+w; i++) tiles[j][i] = FLOOR[f]; });
    MAP.doors.forEach(([x,y,f]) => tiles[y][x] = FLOOR[f]);
  }
  function entsNow(){
    const list = MAP.ents.slice();
    const c = T.ci >= 0 && T.step === 'case' ? CASES[T.ci] : null;
    if (c){
      const p = c.pos[T.cs.v];
      list.push({id:c.npc, npc:c.npc, tiles:[[p.x,p.y]], expr:p.expr, pose:p.pose, shake:p.shake, main:true});
      c.extras.forEach(e => list.push({id:e.id, npc:e.id, tiles:[[e.x,e.y]], expr:e.expr, pose:e.pose}));
    }
    return list;
  }
  function rebuildBlock(){
    block = Array.from({length:H}, () => new Uint8Array(W));
    entsNow().forEach(e => e.tiles.forEach(([x,y]) => block[y][x] = 1));
  }
  const walk = (x, y) => x >= 0 && y >= 0 && x < W && y < H && tiles[y][x] && !block[y][x];
  function entAt(x, y){ return entsNow().find(e => e.tiles.some(([a,b]) => a === x && b === y)); }

  function newTown(){
    return {
      step:'intro', ci:-1, cs:null, p:{x:MAP.start[0]*TS+8, y:MAP.start[1]*TS+8, dir:'down', anim:0}, path:[], target:null,
      cam:{x:0,y:0}, zone:'', results:[], cards:new Set(), t:0, busy:false,
    };
  }
  function reset(){ build(); T = newTown(); rebuildBlock(); centerCam(true); }

  /* ---------- 移動 ---------- */
  function bfs(sx, sy, goal){
    const prev = new Map(), key = (x,y) => y*W + x, q = [[sx,sy]]; prev.set(key(sx,sy), null);
    while (q.length){

      if (b.dis) el.disabled = true; el.addEventListener('click', () => b.fn(el)); box.appendChild(el); });
    $('#panel').classList.add('on');
  },
  closePanel(){ $('#panel').classList.remove('on'); if (!this._dlg) Town.T.busy = false; },

  /* ----- 進度提示 ----- */
  objective(){
    const T = Town.T, o = $('#obj');
    const done = T.results.length;
    const txt = {intro:'聽米亞說明', shelf:'點書架，拿《情緒圖鑑》', mia:'跟米亞說話', board: done ? `已完成 ${done}/3 件。回走廊公布欄選下一步` : '到走廊看公布欄', return:'回社辦，在走廊最左邊', stage:''}[T.step];
    if (T.step === 'case'){ const c = CASES[T.ci]; o.innerHTML = `委託 ${T.ci+1}/3：到${c.place}找${NAMES[c.npc]}<small>點他和周圍的東西找線索，找到 2 種就能判斷情緒</small>`; }
    else o.textContent = txt || '';
  },
  camBias(){ return this._dlg && this.layout !== 'tall' ? VH * .22 : 0; },
  goalTile(){
    const T = Town.T;
    if (T.step === 'shelf') return [2,1]; if (T.step === 'mia') return [7,2]; if (T.step === 'board') return [11,8];
    if (T.step === 'return') return [5,7];
    if (T.step === 'case'){ const p = CASES[T.ci].pos[T.cs.v]; return [p.x, p.y]; }
    return null;
  },
  updateLook(){
    const btn = $('#lookBtn'), T = Town.T;
    const e = this.mode === 'town' && T && !T.busy && !T.path.length ? Town.nearby() : null;
    const label = e ? (e.npc ? NAMES[e.npc] : e.name || '這裡') : '走到人或東西旁邊';
    if (btn.disabled !== !e) btn.disabled = !e;
    const n = $('#lookName'); if (n.textContent !== label) n.textContent = label;
  },
  clueCount(){ const T = Town.T; const n = T && T.cs ? Object.keys(T.cs.found).length : 0; $('#clueN').textContent = `${n}/4`; },
  bookOn(){ this.book = true; },
  learn(k){ this.skills.add(k); refreshSkills(); },

  /* ----- 公布欄、案件 ----- */
  boardPanel(go){
    const T = Town.T, done = new Set(T.results.map(r => r.idx)), n = done.size;
    const html = CASES.map((x, i) => `<p><span class="tag">委託 ${i+1}</span>${done.has(i) ? '✅ ' : ''}${esc(x.board)}</p>`).join('') +
      `<p class="hint">${n ? `已完成 ${n}/3 件。想繼續、去闖關，或今天先收工都可以。` : '想先做哪件都可以。完成一件以後，就能隨時結束今天的調查。'}</p>`;
    const btns = CASES.map((x, i) => done.has(i) ? null : {t:`接下委託 ${i+1}：${x.title}`, cls:'pri', fn:() => { this.closePanel(); go(i); }}).filter(Boolean);
    if (n && this.skills.size >= 2 && !this.stageStats) btns.push({t:'🎮 去闖關（闖完就結案）', fn:() => { this.closePanel(); T.step = 'return'; this.objective(); toast('回社辦的路上……', 1600); }});
    if (n) btns.push({t:'📋 結束今天的調查', fn:() => { this.closePanel(); this.settle(); }});
    btns.push({t:'先不要', fn:() => this.closePanel()});
    this.panel('公布欄・今日委託', html, btns);
  },
  casePanel(){
    const T = Town.T, c = CASES[T.ci], cs = T.cs, v = cs.v, who = NAMES[c.npc];
    const n = Object.keys(cs.found).length;
    const list = cs.clues.length ? cs.clues.map(k => `<p><span class="tag ${k.type}">${TYPE_NAME[k.type]}</span>${esc(k.text)}</p>`).join('') : '<p class="hint">還沒有線索。可以看看他，也可以調查周圍。</p>';
    const back = () => this.casePanel();
    if (cs.fit){ this.say([['sys', '這個委託已經結案了。']]); return; }
    if (cs.named){
      this.panel(`陪${who}想辦法`, `<p>${esc(who)}現在的情緒是「${esc(cs.word)}」。你會怎麼做？</p>`,
        cs.order.map(o => ({t:esc(o.t), cls:'wide', fn:() => this.choose(o)})));
      return;
    }
    const look = (type, txt, line) => () => { this.closePanel(); const fresh = Town.addClue(type, txt);
      this.say([line || ['sys', txt], ['sys', fresh ? `找到「${TYPE_NAME[type]}」線索。` : '這個線索已經記下來了。']], back); };
    const talk = c.npcClues.talk[v];
    this.panel(who, `<p class="hint">已找到 ${n}/4 種線索</p>` + list, [
      {t:'看他的表情', cls:cs.found.face ? 'got' : '', fn:look('face', c.npcClues.face[v])},
      {t:'看他的動作', cls:cs.found.body ? 'got' : '', fn:look('body', c.npcClues.body[v])},
      {t:'跟他說話', cls:cs.found.talk && talk ? 'got' : '', fn: talk ? look('talk', talk, [c.npc, talk]) : () => { this.closePanel(); this.say([['sys', c.noTalk]], back); }},
      {t:'說出他的情緒', cls:'pri', dis:n < 2, fn:() => this.namePanel()},
      {t:'先離開', fn:() => this.closePanel()},
    ]);
  },
  namePanel(){
    const T = Town.T, c = CASES[T.ci], cs = T.cs, n = Object.keys(cs.found).length, fine = n >= 3;
    let word = null, lv = null;
    const words = BASE_WORDS.concat(fine ? FINE_WORDS : []);
    const html = `<p>${esc(NAMES[c.npc])}現在是什麼情緒？有多強烈？</p>
      <div class="words">${words.map(w => `<button class="pb" data-w="${w}">${w}</button>`).join('')}</div>
      ${fine ? '' : '<p class="hint">再多找一種線索，可以選的詞會更多、更準。</p>'}
      <p style="margin-top:12px">強度：1 是一點點，5 是非常強烈</p>
      <div class="lv">${[1,2,3,4,5].map(i => `<button class="pb" data-l="${i}">${i}</button>`).join('')}</div>`;
    this.panel('說出他的情緒', html, [
      {t:'確定', cls:'pri', id:'nameOk', dis:true, fn:() => { this.closePanel(); this.judge(word, lv); }},
      {t:'回去找線索', fn:() => { this.closePanel(); this.casePanel(); }},
    ]);
    const ok = () => { $('#nameOk').disabled = !(word && lv); };
    document.querySelectorAll('#pBody [data-w]').forEach(b => b.addEventListener('click', () => { word = b.dataset.w; document.querySelectorAll('#pBody [data-w]').forEach(x => x.classList.toggle('sel', x === b)); ok(); }));
    document.querySelectorAll('#pBody [data-l]').forEach(b => b.addEventListener('click', () => { lv = +b.dataset.l; document.querySelectorAll('#pBody [data-l]').forEach(x => x.classList.toggle('sel', x === b)); ok(); }));
  },
  judge(word, lv){
    const T = Town.T, c = CASES[T.ci], cs = T.cs, v = cs.v, who = c.npc;
    cs.tries++;
    if (c.best[v].includes(word)){ cs.word = word; cs.lv = lv; this.evidencePanel(); return; }
    if (c.ok[v].includes(word)){ // 方向對但不夠細，不能結案
      this.say([[who, `是有點${word}……可是不只是這樣。`], ['sys', `「${word}」底下還藏著別的感覺。再多找線索，換一個更準的詞。`]], () => this.casePanel());
      return;
    }
    const w = c.wrong[word], line = w && typeof w === 'object' ? w[v] : w;
    this.say([line ? [who, line] : ['sys', `${NAMES[who]}皺了皺眉：「好像不是這樣……」`], ['sys', '再回去多看看線索吧。']], () => this.casePanel());
  },
  evidencePanel(){
    const T = Town.T, c = CASES[T.ci], cs = T.cs, v = cs.v, word = cs.word;
    const has = cs.clues.some(k => c.evidence[v].includes(k.key));
    const list = cs.clues.map((k, i) => `<button class="pb wide" data-e="${i}"><span class="tag ${k.type}">${TYPE_NAME[k.type]}</span>${esc(k.text)}</button>`).join('');
    this.panel(`為什麼是「${word}」？`, `<p>從線索本挑一條最能說明「${esc(word)}」的線索。</p><div class="row">${list}</div>` +
      (has ? '' : '<p class="hint">你的線索本裡好像還沒有能證明這個情緒的線索，再去找找看。</p>'),
      [{t:'回去找線索', fn:() => { this.closePanel(); this.casePanel(); }}]);
    document.querySelectorAll('#pBody [data-e]').forEach(b => b.addEventListener('click', () => { this.closePanel(); this.checkEvidence(cs.clues[+b.dataset.e]); }));
  },
  checkEvidence(k){
    const T = Town.T, c = CASES[T.ci], cs = T.cs, v = cs.v, who = c.npc, word = cs.word;
    cs.evTries++;
    if (!c.evidence[v].includes(k.key)){
      this.say([[who, '這跟那個沒什麼關係吧……'], ['sys', `這條線索說明不了「${word}」。再挑一條，或回去多找線索。`]], () => this.evidencePanel());
      return;
    }
    cs.named = 'best'; cs.typesAtName = Object.keys(cs.found).length; cs.order = shuffle(c.options);
    const target = c.level[v], lines = [['sys', `證據：${k.text}`], [who, c.right[v]]];
    lines.push(['sys', Math.abs(cs.lv - target) <= 1 ? `強度也判斷得很準，是 ${target}。` : `強度差了一點，他看起來大概是 ${target}。`]);
    lines.push(['sys', '他聽到你說出來，看起來放鬆了一點。']);
    this.say(lines, () => this.casePanel());
  },
  choose(o){
    this.closePanel();
    const T = Town.T, c = CASES[T.ci], cs = T.cs, v = cs.v, res = o[v], card = c.best[v][0];
    cs.fit = res.fit; cs.choice = o.m;
    if (res.fit === 'great'){ (this.methods[card] = this.methods[card] || []).push(o.m); }
    const lines = [['sys', res.r], ['sys', `〔${FIT[res.fit]}〕${o.m}`]].concat(c.close);
    this.learn(c.skill);
    lines.push(['sys', `🎁 學會技能「${c.skillName}」，闖關時用得到。`]);
    if (cs.named === 'best'){ Town.T.cards.add(card); lines.push(['sys', `情緒圖鑑新增一張：「${card}」`]); }
    else lines.push(['sys', `這次的情緒還有更細的名字，圖鑑先空著。`]);
    this.say(lines, () => { Town.finishCase(); this.clueCount(); });
  },

  /* ----- 闖關 ----- */
  bump(){
    const T = Town.T; T.step = 'stage';
    this.say(TUTORIAL.bump, () => this.startStage());
  },
  startStage(){
    this.mode = 'stage'; $('#ctlTown').hidden = true; $('#ctlStage').hidden = false; $('#hud').hidden = false; $('#obj').hidden = true;
    reset(); S.running = true;
    // 沒學會的技能，對應的關卡直接打開，避免卡關
    if (!this.skills.has('say')){ S.lit = true; S.litR = 1; }
    if (!this.skills.has('angle')) S.fr.forEach(f => { f.state = 'bridge'; f.k = 1; setWall(f, false); for (let x = f.bridge[0]; x <= f.bridge[1]; x++) grid[GROUND][x] = 1; });
    refreshSkills();
    toast('先往右走。碰到生氣怪之前，想想該用哪一招。', 2600);
  },
  stageWon(stats){
    this.stageStats = stats; const T = Town.T;
    T.cards.add('生氣'); T.cards.add('丟臉');
    const u = stats.used, m = [];
    if (u.pause) m.push('暫停'); if (u.breath) m.push('深呼吸');
    this.methods['生氣'] = (this.methods['生氣'] || []).concat(m);
    if (u.say) this.methods['丟臉'] = (this.methods['丟臉'] || []).concat(['說出來']);
    this.settle();
  },

  /* ----- 結算 ----- */
  cardsHtml(){
    const T = Town.T;
    return '<div class="cards">' + CARD_ORDER.map(w => {
      if (!T || !T.cards.has(w)) return '<div class="ecard none">？</div>';
      const c = CARDS[w], ms = [...new Set(this.methods[w] || [])];
      return `<div class="ecard"><h3>${w}</h3><dl><dt>身體會怎樣</dt><dd>${c.body}</dd><dt>常常因為</dt><dd>${c.cause}</dd><dt>試過有用的方法</dt><dd>${ms.length ? ms.join('、') : '還沒試出來'}</dd></dl></div>`;
    }).join('') + '</div>';
  },
  settle(){
    this.mode = 'settle'; $('#hud').hidden = true; $('#obj').hidden = true; $('#ctlStage').hidden = true; $('#ctlTown').hidden = true;
    ['#panel'].forEach(id => $(id).classList.remove('on')); $('#dlg').hidden = true; this._dlg = null;
    const T = Town.T, r = T.results, n = Math.max(1, r.length);
    const avg = r.reduce((a, x) => a + x.typesAtName, 0) / n;
    const clueLine = avg >= 3.5 ? VERDICT.clue4 : avg >= 2.5 ? VERDICT.clue3 : VERDICT.clue2;
    const first = r.filter(x => x.tries === 1 && x.evTries === 1).length;
    const nameLine = first === r.length ? VERDICT.nameBest : VERDICT.nameOk;
    const great = r.filter(x => x.fit === 'great').length, fitLine = great >= Math.ceil(r.length * .6) ? VERDICT.fitHigh : VERDICT.fitLow;
    const rows = `<p>完成 <b>${r.length}/3</b> 個委託；第一次就說對情緒和證據：<b>${first}/${r.length}</b> 個</p>` + CASES.map((c, i) => {
      const x = r.find(y => y.idx === i);
      if (!x) return `<p><span class="tag">委託 ${i+1}</span>${NAMES[c.npc]}：這次沒處理</p>`;
      return `<p><span class="tag">委託 ${i+1}</span>${NAMES[c.npc]}：線索 ${x.typesAtName} 種，說了 ${x.tries} 次、挑證據 ${x.evTries} 次，陪伴方法「${x.choice}」<span class="fit ${x.fit}">${FIT[x.fit]}</span></p>`; }).join('');
    const story = this.stageStats ? `<p>你走到社辦門口，發現自己的手已經放開了。</p>
      <p>你在新的一頁寫下：「被撞的時候，我很生氣。後來發現，其實也很丟臉。」</p>
      <p><span class="who">米亞：</span>歡迎正式加入偵探社。</p>` :
      `<p>今天的調查先到這裡。你把找到的線索整理進偵探筆記。</p><p><span class="who">米亞：</span>沒做完的委託不會跑掉，下次再來。</p>`;
    $('#settleCard').innerHTML = `<h2>結案報告・第三章 生氣</h2>${story}
      <h2 style="margin-top:16px">情緒圖鑑</h2>${this.cardsHtml()}
      <h2 style="margin-top:16px">偵探評語</h2>
      <p>${clueLine}</p><p>${nameLine}</p><p>${fitLine}</p>
      ${rows}
      <p><span class="who">米亞：</span>${VERDICT.last}</p>
      <p class="cite">${CITE}</p>
      <div class="row"><button class="pb pri" id="againBtn">選擇章節</button></div>`;
    $('#settle').classList.add('on');
    $('#againBtn').addEventListener('click', () => { $('#settle').classList.remove('on'); this.chapterSelect(); });
  },
  chapterSelect(){
    ['#settle','#paused','#panel'].forEach(id => $(id).classList.remove('on')); $('#dlg').hidden = true; this._dlg = null;
    this.mode = 'title'; this.paused = false; $('#titleScr').classList.remove('on');
    $('#chList').innerHTML = CHAPTERS.map(c => `<button class="chc${c.ready ? '' : ' soon'}" id="ch${c.n}" ${c.ready ? '' : 'disabled'}>
      <span class="che">${c.emoji}</span><b>第${'一二三四五'[c.n-1]}章</b><span class="chn">${c.name}</span><small>${c.words}</small><i>${c.ready ? '可以玩' : '製作中'}</i></button>`).join('');
    CHAPTERS.filter(c => c.ready).forEach(c => $('#ch' + c.n).addEventListener('click', () => { $('#chapters').classList.remove('on'); this.begin(); }));
    $('#chapters').classList.add('on');
  },
  toTitle(){
    ['#settle','#paused','#panel','#chapters'].forEach(id => $(id).classList.remove('on')); $('#dlg').hidden = true; this._dlg = null;
    this.mode = 'title'; this.paused = false; $('#titleScr').classList.add('on');
  },
  begin(){
    this.skills = new Set(); this.methods = {}; this.stageStats = null; this.book = false;
    $('#titleScr').classList.remove('on'); $('#obj').hidden = false; $('#ctlTown').hidden = false; $('#ctlStage').hidden = true; $('#hud').hidden = true;
    S = null; Town.reset(); this.mode = 'town'; this.objective(); this.clueCount(); refreshSkills();
    this.say(TUTORIAL.opening, () => { Town.T.step = 'shelf'; this.objective(); });
  },

  /* ----- 圖鑑、線索本 ----- */
  showBook(){
    if (!this.book){ toast('還沒有拿到情緒圖鑑。社辦的書架上有。'); return; }
    this.panel('情緒圖鑑', this.cardsHtml(), [{t:'關閉', cls:'pri', fn:() => this.closePanel()}]);
  },
  showNotes(){
    const T = Town.T;
    if (!T.cs){ toast('接下委託後，找到的線索會記在這裡。'); return; }
    const html = T.cs.clues.length ? T.cs.clues.map(k => `<p><span class="tag ${k.type}">${TYPE_NAME[k.type]}</span>${esc(k.text)}</p>`).join('') : '<p class="hint">還沒有線索。</p>';
    this.panel(`線索本：${CASES[T.ci].title}`, html, [{t:'關閉', cls:'pri', fn:() => this.closePanel()}]);
  },
};

/* =========================================================
   入口：觸控、鍵盤、縮放
   ========================================================= */
const cvEl = document.getElementById('cv');
function layoutFor(w, h){ return w < h ? 'tall' : (w / h > 1.9 && h < 640) ? 'wide' : 'normal'; }
function fit(){
  const L = layoutFor(innerWidth, innerHeight);
  document.body.className = 'L-' + L; Game.layout = L;
  const box = $('#screen'), bw = box.clientWidth, bh = box.clientHeight;
  const s = Math.max(.5, Math.min(bw / VW, bh / VH));
  cvEl.style.width = Math.floor(VW*s) + 'px'; cvEl.style.height = Math.floor(VH*s) + 'px';
}
addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(() => fit()).observe($('#screen'));
cvEl.addEventListener('pointerdown', e => {
  if (Game.mode !== 'town' || Game.paused) return;
  const r = cvEl.getBoundingClientRect();
  Town.tap((e.clientX - r.left) * VW / r.width, (e.clientY - r.top) * VH / r.height);
});
$('#dbox').addEventListener('click', () => Game._next());
function hold(el, on, off){
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('on'); on(); });
  const up = () => { el.classList.remove('on'); off(); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
}
hold($('#left'), () => input.left = true, () => input.left = false);
hold($('#right'), () => input.right = true, () => input.right = false);
hold($('#jump'), () => { input.jump = true; input.jumpPressed = true; }, () => input.jump = false);
document.querySelectorAll('.sk').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); useSkill(b.dataset.k); }));
const KEYS = {ArrowLeft:'left', a:'left', ArrowRight:'right', d:'right'};
addEventListener('keydown', e => {
  if (Game.mode === 'town' && !Game.paused){
    if (Game._dlg && (e.key === ' ' || e.key === 'Enter')){ Game._next(); return; }
    if (!$('#panel').classList.contains('on') && (e.key === ' ' || e.key === 'Enter')){ Town.lookNearby(); return; }
    const d = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]}[e.key];
    if (d){ const [x,y] = Town.tileOf(); Town.goTo(x + d[0], y + d[1]); }
    return;
  }
  if (Game.mode !== 'stage') return;
  if (KEYS[e.key]) input[KEYS[e.key]] = true;
  if ((e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') && !e.repeat){ input.jump = true; input.jumpPressed = true; }
  const sk = {'1':'breath','2':'pause','3':'angle','4':'say'}[e.key]; if (sk) useSkill(sk);
});
addEventListener('keyup', e => { if (KEYS[e.key]) input[KEYS[e.key]] = false; if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') input.jump = false; });
function togglePause(force){
  if (Game.mode !== 'town' && Game.mode !== 'stage') return;
  Game.paused = force != null ? force : !Game.paused; $('#paused').classList.toggle('on', Game.paused);
  if (S) S.paused = Game.paused;
}
$('#pauseBtn').addEventListener('click', () => togglePause());
$('#resumeBtn').addEventListener('click', () => togglePause(false));
$('#restartBtn').addEventListener('click', () => { togglePause(false); Game.toTitle(); });
$('#startBtn').addEventListener('click', () => Game.chapterSelect());
$('#chBack').addEventListener('click', () => { $('#chapters').classList.remove('on'); Game.toTitle(); });
$('#notesBtn').addEventListener('click', () => { if (Game.mode === 'town' && !Game._dlg) Game.showNotes(); });
$('#lookBtn').addEventListener('click', () => { if (Game.mode === 'town' && !Game.paused && !Game._dlg) Town.lookNearby(); });
$('#bookBtn').addEventListener('click', () => { if (Game.mode === 'town' && !Game._dlg) Game.showBook(); });
if (typeof IMG_SRC !== 'undefined' && IMG_SRC.title) $('#titleScr').style.backgroundImage = `url(${IMG_SRC.title})`;

/* =========================================================
   地基：固定步長主迴圈；測試積木 window.__GAME
   ========================================================= */
const DT = 1/60; let last = performance.now(), acc = 0;
function tick(dt){
  if (Game.paused) return;
  if (Game.mode === 'town') Town.update(dt);
  else if (Game.mode === 'stage') update(dt);
}
function render(){
  if (Game.mode === 'stage' && S) draw();
  else if (Town.T) Town.draw();
  else { g.fillStyle = '#2B2D42'; g.fillRect(0, 0, VW, VH); }
}
function loop(now){
  acc += Math.min(.1, (now - last)/1000); last = now;
  try { while (acc >= DT){ tick(DT); acc -= DT; } render(); if (Game.mode === 'stage') refreshSkills(); else Game.updateLook(); }
  catch (err){ $('#err').textContent = '錯誤代碼 E1：' + err.message; throw err; }
  requestAnimationFrame(loop);
}
addEventListener('error', e => { $('#err').textContent = '錯誤代碼 E0：' + e.message; });
fit(); requestAnimationFrame(loop);

window.__GAME = {
  Game, Town, CASES, input, useSkill, get S(){ return S; }, solid, LEVEL,
  step(n){ for (let i = 0; i < n; i++) tick(DT); },
  teleport(tx){ S.p.x = tx*TS; S.p.y = (GROUND-1)*TS; S.p.vx = S.p.vy = 0; S.cam = Math.max(0, S.p.x - VW*.4); },
};

})();
</script>
</body>
</html>
